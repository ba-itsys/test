name: CI

on: [ pull_request, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: "mvn -B package --no-transfer-progress"

      - name: 'Artificial delay the ci'
        run: sleep 10

  test-2:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  dependabot-automerge-check:
    runs-on: ubuntu-latest
    needs: [ test, test-2 ]
    if: always()
    steps:
      - name: Verify all test jobs succeeded
        run: |
          results="${{ needs.test.result }} ${{ needs.test-2.result }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "At least one test job did not succeed"
              exit 1
            fi
          done
          echo "All test jobs succeeded"